<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>米思齐工作区 · 总控台</title>
<link rel="stylesheet" href="style.css">
</head>
<body><div id="MIXLY-ONLINE-NOTE" style="position:relative;background:#fff3e2;color:#b06a17;font:500 12px/1.5 sans-serif;padding:5px 34px 5px 14px;border-bottom:1px solid #ffd9a8;text-align:center;">&#9888; 在线版为只读快照（可浏览 总览 / 课程库 / 积木索引）；投喂、校验、调起米思齐请用教室电脑上的本机版。<button type="button" onclick="(function(){var b=document.getElementById('MIXLY-ONLINE-NOTE');if(b)b.remove();try{localStorage.setItem('mixly_note_closed','1');}catch(e){}})()" style="position:absolute;right:8px;top:4px;border:0;background:transparent;color:#b06a17;font-size:16px;line-height:1;cursor:pointer;" aria-label="关闭">&#215;</button></div><script>try{if(localStorage.getItem('mixly_note_closed')==='1'){var n=document.getElementById('MIXLY-ONLINE-NOTE');if(n)n.remove();}}catch(e){}</script>
<div id="toast" class="toast"></div>

<aside class="side">
  <div class="brand">
    <div class="logo">M</div>
    <div>
      <b>工作区总控台</b>
      <small id="wsPath">mixly</small>
    </div>
  </div>
  <nav id="nav"></nav>
  <div class="side-foot">
    <div class="svc" id="svcBox">
      <div class="svc-head">本地服务</div>
      <ul class="svc-list" id="svcList"><li><span class="dot"></span> 检测中…</li></ul>
      <div class="svc-btns" id="svcBtns">
        <button class="mini" id="svcStartAll" title="拉起未运行的课程预览站(:8890)与抓取接收(:8777)">▶ 一键启动本地服务</button>
        <button class="mini ghost" id="svcStopAll" title="关闭本机全部服务（含总控台自身，下次需双击 启动总控台.bat 重开）">■ 全部关闭</button>
      </div>
      <a class="svc-openlocal" id="svcOpenLocal" href="http://127.0.0.1:8899" target="_blank" rel="noopener" style="display:none">▶ 打开本机总控台（启停服务需在本机版）</a>
    </div>
    <small>投喂流程：网页点一下 → 指令进剪贴板 → 回对话 <b>Ctrl+V</b> 发送</small>
  </div>
</aside>

<main class="main">
  <header class="top">
    <h2 id="viewTitle">总览</h2>
    <div class="top-tools">
      <input id="globalSearch" placeholder="搜积木 / 搜文件…" autocomplete="off">
      <button id="reloadBtn" class="ghost">↻ 刷新</button>
    </div>
  </header>
  <section id="view" class="view"></section>
</main>

<script src="app.js"></script>
</body>
</html>
